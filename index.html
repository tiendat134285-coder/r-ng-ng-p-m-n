<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trình xem Video 360°</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body { margin: 0; overflow: hidden; }

#playButton {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9999;
  padding: 15px 30px;
  background: #ff4757;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<button id="playButton">Bấm để xem video 360°</button>

<a-scene vr-mode-ui="enabled: true">

  <a-assets>
    <!-- FILE VIDEO -->
    <video id="video360"
           src="1.mp4"
           preload="auto"
           loop
           muted
           crossorigin="anonymous"
           playsinline
           webkit-playsinline>
    </video>
  </a-assets>

  <!-- CAMERA CHUẨN 360 -->
  <a-entity camera
            look-controls="touchEnabled: true; mouseEnabled: true; magicWindowTrackingEnabled: true">
  </a-entity>

  <!-- VIDEO 360 -->
  <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

</a-scene>

<script>
const playButton = document.getElementById('playButton');
const video = document.getElementById('video360');

playButton.addEventListener('click', async () => {
  try {
    // XIN QUYỀN CẢM BIẾN (iPhone)
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {

      const permission = await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {
        alert("Bạn cần cấp quyền để xoay 360!");
        return;
      }
    }

    // BẬT ÂM THANH
    video.muted = false;
    video.volume = 1;

    // PHÁT VIDEO
    await video.play();

    // ẨN NÚT
    playButton.style.display = 'none';

  } catch (err) {
    alert("Lỗi phát video: " + err.message);
    console.log(err);
  }
});
</script>

</body>
</html>
