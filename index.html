<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Video 360° Có Âm Thanh</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body { margin: 0; overflow: hidden; }

#playButton {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9999;
  padding: 15px 30px;
  background: #ff4757;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<button id="playButton">BẤM ĐỂ XEM VIDEO 360°</button>

<a-scene vr-mode-ui="enabled: true">

  <a-assets>
    <!-- VIDEO KHÔNG muted -->
    <video id="video360"
           src="1.mp4"
           preload="auto"
           loop
           crossorigin="anonymous"
           playsinline
           webkit-playsinline>
    </video>
  </a-assets>

  <!-- Camera -->
  <a-entity camera
            look-controls="touchEnabled: true; mouseEnabled: true; magicWindowTrackingEnabled: true">
  </a-entity>

  <!-- Video 360 -->
  <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

</a-scene>

<script>
const btn = document.getElementById('playButton');
const video = document.getElementById('video360');

btn.addEventListener('click', async () => {
  try {

    // ✅ Xin quyền cảm biến (iPhone)
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {

      const permission = await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {
        alert("Bạn cần cấp quyền để xoay 360!");
        return;
      }
    }

    // ✅ Trick bắt buộc để có âm thanh trên mọi trình duyệt
    video.muted = true;
    await video.play();

    // bật lại âm thanh sau khi đã play
    setTimeout(() => {
      video.muted = false;
      video.volume = 1;
    }, 300);

    btn.style.display = "none";

  } catch (err) {
    alert("Lỗi phát video: " + err.message);
    console.log(err);
  }
});
</script>

</body>
</html>
