<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>360 Video + Audio FIX</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body { margin: 0; overflow: hidden; }

#playButton {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9999;
  padding: 15px 30px;
  background: #ff4757;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<button id="playButton">BẤM ĐỂ XEM 360°</button>

<a-scene>

  <a-assets>
    <video id="video360"
           src="1.mp4"
           preload="auto"
           loop
           crossorigin="anonymous"
           playsinline
           webkit-playsinline>
    </video>
  </a-assets>

  <!-- camera -->
  <a-entity camera
            look-controls="touchEnabled: true; mouseEnabled: true; magicWindowTrackingEnabled: true">
  </a-entity>

  <!-- video 360 -->
  <a-videosphere src="#video360"></a-videosphere>

</a-scene>

<script>
const btn = document.getElementById('playButton');
const video = document.getElementById('video360');

btn.onclick = async () => {
  try {

    // iOS xin quyền cảm biến
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {

      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        alert("Cần cấp quyền xoay 360");
        return;
      }
    }

    // ⚠️ FIX CHÍNH: ép trình duyệt cho phép audio
    video.muted = false;
    video.volume = 1;

    // tạo tương tác "user gesture" mạnh hơn
    video.currentTime = 0;

    // play nhiều lần nếu cần
    await video.play();

    // fallback nếu browser vẫn block
    setTimeout(() => {
      if (video.paused) {
        video.play();
      }
    }, 500);

    btn.style.display = "none";

  } catch (e) {
    alert("Lỗi audio: " + e.message);
    console.log(e);
  }
};
</script>

</body>
</html>
